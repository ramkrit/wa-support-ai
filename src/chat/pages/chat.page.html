<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>WA Support AI — Chat</title>
  <style>
    :root {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      --bg: #0a0f0d;
      --surface: rgba(10, 20, 18, 0.92);
      --border: rgba(255,255,255,0.06);
      --accent: #14b8a6;
      --accent-dim: rgba(20,184,166,0.15);
      --text: #ecfdf5;
      --text-muted: #86a89c;
      --user-bg: #134e4a;
      --ai-bg: rgba(20,30,25,0.9);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(ellipse at 30% 0%, rgba(20,184,166,0.08) 0%, transparent 50%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ecfdf5, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .actions { display: flex; gap: 8px; }
    header button {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(20,184,166,0.3);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    header button:hover { background: rgba(20,184,166,0.25); }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message .meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .typing {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 8px 0;
    }
    .typing::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
    .input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      backdrop-filter: blur(8px);
    }
    .input-area textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      transition: border-color 0.2s;
    }
    .input-area textarea:focus { border-color: var(--accent); }
    .input-area button {
      background: var(--accent);
      color: #0a0f0d;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-area button:hover:not(:disabled) { opacity: 0.85; }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>WA Support AI — Chat</h1>
    <div class="actions">
      <button onclick="clearChat()">New Chat</button>
      <a href="/" style="text-decoration:none"><button>Dashboard</button></a>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">Send a message to start a conversation</div>
  </div>

  <div class="input-area">
    <textarea id="messageInput" placeholder="Type a message..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    let sessionId = crypto.randomUUID();
    const chatArea = document.getElementById('chatArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');

    // Auto-resize textarea
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });

    function addMessage(role, content) {
      if (emptyState) emptyState.remove();
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.textContent = content;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typingIndicator';
      div.textContent = 'Thinking';
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';
      sendBtn.disabled = true;

      addMessage('user', text);
      showTyping();

      try {
        const res = await fetch('/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId }),
        });

        removeTyping();

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let aiDiv = addMessage('assistant', '');
        let fullContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const data = JSON.parse(line.slice(6));
              if (data.content) {
                fullContent += data.content;
                aiDiv.textContent = fullContent;
                chatArea.scrollTop = chatArea.scrollHeight;
              }
              if (data.sessionId) sessionId = data.sessionId;
              if (data.error) {
                aiDiv.textContent = 'Error: ' + data.error;
              }
            } catch (e) {}
          }
        }
      } catch (err) {
        removeTyping();
        addMessage('assistant', 'Connection error: ' + err.message);
      }

      sendBtn.disabled = false;
      messageInput.focus();
    }

    function clearChat() {
      fetch('/chat/session/' + sessionId, { method: 'DELETE' });
      sessionId = crypto.randomUUID();
      chatArea.innerHTML = '<div class="empty-state">Send a message to start a conversation</div>';
    }
  </script>
</body>
</html>
