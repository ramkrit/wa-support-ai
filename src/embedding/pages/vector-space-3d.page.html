<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>WA Support AI — 3D Vector Space</title>
  <style>
    :root {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      --bg: #0a0f0d;
      --surface: rgba(10, 20, 18, 0.92);
      --border: rgba(255,255,255,0.06);
      --accent: #14b8a6;
      --text: #ecfdf5;
      --text-muted: #86a89c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ecfdf5, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .actions { display: flex; gap: 8px; align-items: center; }
    header button {
      background: rgba(20,184,166,0.15);
      color: var(--accent);
      border: 1px solid rgba(20,184,166,0.3);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    header button:hover { background: rgba(20,184,166,0.25); }
    .stats {
      padding: 8px 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    #container { flex: 1; position: relative; }
    .tooltip {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78rem;
      max-width: 320px;
      pointer-events: none;
      display: none;
      z-index: 100;
      color: var(--text);
      line-height: 1.4;
      backdrop-filter: blur(8px);
    }
    .tooltip .label { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
    .tooltip .content { color: var(--text-muted); }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      z-index: 20;
    }
    .controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 0.7rem;
      color: var(--text-muted);
      z-index: 10;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Vector Space — 3D Projection</h1>
    <div class="actions">
      <button onclick="toggleAutoRotate()">Auto-Rotate</button>
      <button onclick="resetCamera()">Reset View</button>
      <a href="/embedding/visualize" style="text-decoration:none"><button>2D View</button></a>
      <a href="/" style="text-decoration:none"><button>Dashboard</button></a>
    </div>
  </header>
  <div class="stats" id="stats">Loading...</div>
  <div id="container">
    <div class="tooltip" id="tooltip">
      <div class="label" id="tooltipLabel"></div>
      <div class="content" id="tooltipContent"></div>
    </div>
    <div class="loading" id="loading">Loading vector space data...</div>
    <div class="controls">
      Drag to rotate · Scroll to zoom · Right-drag to pan
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const container = document.getElementById('container');
    const tooltip = document.getElementById('tooltip');
    const tooltipLabel = document.getElementById('tooltipLabel');
    const tooltipContent = document.getElementById('tooltipContent');
    const loading = document.getElementById('loading');
    const statsEl = document.getElementById('stats');

    // Three.js setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f0d);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(2, 1.5, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    // Grid
    const grid = new THREE.GridHelper(2, 10, 0x1a2e2a, 0x0f1f1b);
    grid.position.y = -1;
    scene.add(grid);

    // Axes
    const axes = new THREE.AxesHelper(1.2);
    axes.position.set(-1, -1, -1);
    scene.add(axes);

    // Raycaster for hover
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.04;
    const mouse = new THREE.Vector2();
    let pointsObj = null;
    let chunksData = [];

    function reduceTo3D(vectors) {
      if (vectors.length === 0) return [];
      const dim = vectors[0].length;
      const n = vectors.length;

      const mean = new Float64Array(dim);
      for (const v of vectors) for (let i = 0; i < dim; i++) mean[i] += v[i];
      for (let i = 0; i < dim; i++) mean[i] /= n;

      const centered = vectors.map(v => v.map((x, i) => x - mean[i]));

      function powerIteration(data, dims, existing = []) {
        let axis = new Float64Array(dims);
        for (let i = 0; i < dims; i++) axis[i] = Math.random() - 0.5;

        for (let iter = 0; iter < 50; iter++) {
          let newAxis = new Float64Array(dims);
          for (const row of data) {
            let dot = 0;
            for (let i = 0; i < dims; i++) dot += row[i] * axis[i];
            for (let i = 0; i < dims; i++) newAxis[i] += dot * row[i];
          }
          for (const ex of existing) {
            let proj = 0;
            for (let i = 0; i < dims; i++) proj += newAxis[i] * ex[i];
            for (let i = 0; i < dims; i++) newAxis[i] -= proj * ex[i];
          }
          let norm = 0;
          for (let i = 0; i < dims; i++) norm += newAxis[i] * newAxis[i];
          norm = Math.sqrt(norm) || 1;
          for (let i = 0; i < dims; i++) axis[i] = newAxis[i] / norm;
        }
        return axis;
      }

      const pc1 = powerIteration(centered, dim, []);
      const pc2 = powerIteration(centered, dim, [pc1]);
      const pc3 = powerIteration(centered, dim, [pc1, pc2]);

      return centered.map(row => {
        let x = 0, y = 0, z = 0;
        for (let i = 0; i < dim; i++) {
          x += row[i] * pc1[i];
          y += row[i] * pc2[i];
          z += row[i] * pc3[i];
        }
        return [x, y, z];
      });
    }

    async function loadData() {
      loading.style.display = 'flex';
      try {
        const res = await fetch('/embedding/visualize-data');
        const data = await res.json();

        if (data.chunks.length === 0) {
          loading.textContent = 'No embedded chunks found. Upload documents and run embedding first.';
          return;
        }

        const vectors = data.chunks.map(c => c.embedding);
        const projected = reduceTo3D(vectors);

        // Normalize to [-1, 1]
        let min = [Infinity, Infinity, Infinity];
        let max = [-Infinity, -Infinity, -Infinity];
        for (const p of projected) {
          for (let i = 0; i < 3; i++) { min[i] = Math.min(min[i], p[i]); max[i] = Math.max(max[i], p[i]); }
        }
        const range = [max[0]-min[0]||1, max[1]-min[1]||1, max[2]-min[2]||1];
        const normalized = projected.map(p => [
          (p[0] - min[0]) / range[0] * 2 - 1,
          (p[1] - min[1]) / range[1] * 2 - 1,
          (p[2] - min[2]) / range[2] * 2 - 1,
        ]);

        // Color by document
        const docIds = [...new Set(data.chunks.map(c => c.documentId))];
        const palette = [0x14b8a6, 0xf59e0b, 0xef4444, 0x8b5cf6, 0xec4899, 0x06b6d4, 0x84cc16, 0xf97316];

        chunksData = data.chunks.map((chunk, i) => ({
          ...chunk,
          content: chunk.content.substring(0, 150),
          pos: normalized[i],
          color: palette[docIds.indexOf(chunk.documentId) % palette.length],
        }));

        // Create point cloud
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(chunksData.length * 3);
        const colors = new Float32Array(chunksData.length * 3);

        chunksData.forEach((p, i) => {
          positions[i * 3] = p.pos[0];
          positions[i * 3 + 1] = p.pos[1];
          positions[i * 3 + 2] = p.pos[2];
          const c = new THREE.Color(p.color);
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        });

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: 0.05,
          vertexColors: true,
          transparent: true,
          opacity: 0.85,
          sizeAttenuation: true,
        });

        if (pointsObj) scene.remove(pointsObj);
        pointsObj = new THREE.Points(geometry, material);
        scene.add(pointsObj);

        statsEl.textContent = `${chunksData.length} chunks from ${docIds.length} document(s) · ${vectors[0]?.length || 0} dims → 3D PCA`;
        loading.style.display = 'none';
      } catch (e) {
        loading.textContent = 'Error: ' + e.message;
      }
    }

    // Hover detection
    let hoveredIdx = -1;
    renderer.domElement.addEventListener('mousemove', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      if (!pointsObj) return;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(pointsObj);

      if (intersects.length > 0) {
        const idx = intersects[0].index;
        if (idx !== hoveredIdx) {
          hoveredIdx = idx;
          const p = chunksData[idx];
          tooltipLabel.textContent = `${p.filename} [chunk ${p.chunkIndex}]`;
          tooltipContent.textContent = p.content + '...';
          tooltip.style.display = 'block';
        }
        tooltip.style.left = (e.clientX - rect.left + 14) + 'px';
        tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
      } else {
        hoveredIdx = -1;
        tooltip.style.display = 'none';
      }
    });

    renderer.domElement.addEventListener('mouseleave', () => {
      hoveredIdx = -1;
      tooltip.style.display = 'none';
    });

    function toggleAutoRotate() { controls.autoRotate = !controls.autoRotate; }
    function resetCamera() { camera.position.set(2, 1.5, 2.5); controls.reset(); }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    animate();
    loadData();
  </script>
</body>
</html>
